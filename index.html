<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      라우트별로 달라지는 메타(title, description, canonical, og:*, twitter:*)는
      react-helmet-async를 통해 각 페이지 컴포넌트에서 주입한다.
      여기에는 사이트 전역 정적 메타와 검색엔진 검증 토큰만 둔다.
    -->
    <meta
      name="keywords"
      content="약꼭, 복약 관리, 복약 관리 앱, 복약 알림, 약 알리미, 약 알림 앱, 약 챙겨주는 앱, 영양제 알림, 가족 복약 관리, 약 기록 앱, 처방약 관리, 만성질환 관리"
    />
    <meta name="author" content="약꼭" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#18c988" />

    <!-- Search Console 소유 확인 -->
    <meta name="google-site-verification" content="uOvQedqwiwRibqwoufEaW43dL5rhyMgUgOFPaCATiBA" />
    <meta name="naver-site-verification" content="94fdeed1177679e6360df83e84d713244fc81423" />

    <!-- Preconnect / Pretendard 폰트 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <!-- 공통 Open Graph / Twitter 기본값 (라우트별 가변 값은 Helmet에서 주입) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="약꼭" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="약꼭 — 약을 잊지 마세요. 약꼭이 챙겨드릴게요."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
